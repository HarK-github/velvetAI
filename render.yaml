# Render Blueprint Deployment Specification for velvetAI
# Documentation: https://render.com/docs/blueprint-spec

services:
  # 1. velvetAI REST API Service
  - type: web
    name: velvetai-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @velvetai/contracts... build && pnpm --filter @velvetai/api build
    preDeployCommand: pnpm --filter @velvetai/db db:migrate
    startCommand: pnpm --filter @velvetai/api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: velvetai-db
          property: connectionString
      - key: DATABASE_POOL_MIN
        value: 2
      - key: DATABASE_POOL_MAX
        value: 10
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: INTENT_SIGNING_KEY
        generateValue: true
      - key: CONFIRMATION_TOKEN_SECRET
        generateValue: true
      - key: ENVELOPE_ENCRYPTION_KEY
        generateValue: true
      - key: WEB_BASE_URL
        fromService:
          type: web
          name: velvetai-web
          property: url

  # 2. velvetAI Background Worker (Transactional Outbox & PayPal Reconciliation)
  - type: worker
    name: velvetai-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @velvetai/contracts... build && pnpm --filter @velvetai/worker build
    startCommand: pnpm --filter @velvetai/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: velvetai-db
          property: connectionString
      - key: DATABASE_POOL_MIN
        value: 1
      - key: DATABASE_POOL_MAX
        value: 5
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  # 3. velvetAI React 19 Frontend Static Site
  - type: web
    name: velvetai-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @velvetai/contracts... build && pnpm --filter @velvetai/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: velvetai-api
          property: url
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
      - key: VITE_PAYPAL_ENVIRONMENT
        value: sandbox

# Managed PostgreSQL Database
databases:
  - name: velvetai-db
    databaseName: velvetai
    user: velvet
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
