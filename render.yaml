# Render Blueprint Deployment Specification for velvetAI
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: velvetai-db
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: velvetai
    user: velvetai_owner
    ipAllowList:
      - source: 0.0.0.0/0
        description: external-connection-for-bootstrap-and-seed

envVarGroups:
  - name: velvetai-sandbox-secrets
    envVars:
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: INTENT_SIGNING_KEY
        sync: false
      - key: CONFIRMATION_TOKEN_SECRET
        sync: false
      - key: ENVELOPE_ENCRYPTION_KEY
        sync: false

services:
  - type: web
    name: velvetai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: starter
    healthCheckPath: /health/ready
    preDeployCommand: pnpm --filter @velvetai/db db:migrate
    envVars:
      - fromGroup: velvetai-sandbox-secrets
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        fromDatabase:
          name: velvetai-db
          property: connectionString
      - key: AUTH0_ISSUER
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: MCP_RESOURCE_URL
        sync: false
      - key: PUBLIC_WEB_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_DAILY_TURN_BUDGET
        value: "1500"

  - type: worker
    name: velvetai-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: starter
    envVars:
      - fromGroup: velvetai-sandbox-secrets
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: web
    name: velvetai-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @velvetai/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
